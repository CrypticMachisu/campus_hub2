openapi: 3.0.0
info:
  title: CampusHub API
  version: 2.0.0
  description: >
    REST API for the CampusHub clubs-and-events app. Every request from a
    consumer must carry an API key in the `X-API-Key` header (one key per
    consumer, handed out privately); GET /health is the one exception.
    Reading clubs and events needs no further sign-in; creating or changing
    data additionally requires a bearer token from POST /auth/login. Each key
    may make 100 requests per 60 seconds; exceeding it returns 429 with a
    Retry-After header. All responses are JSON, including the 404 for
    unknown URLs.

servers:
  - url: http://localhost:5000/api
    description: Local development

tags:
  - name: Health
    description: Server status.
  - name: Auth
    description: Sign in and identify the current user.
  - name: Clubs
    description: Campus clubs.
  - name: Events
    description: Events hosted by clubs.
  - name: Admin
    description: Tier1-only operational dashboard.
  - name: Users
    description: Tier1 user administration.
  - name: Admin requests
    description: Asking for, and granting, club-admin rights.
  - name: Signups
    description: Event RSVPs, capacity and waitlist position.
  - name: Comments
    description: Threaded discussion, reactions and moderation.
  - name: Announcements
    description: Club announcements.
  - name: Partner
    description: Proxied AgroConnect data.
  - name: Operations
    description: Runtime request statistics.

# Default for every operation: a valid X-API-Key is required (Week 9).
security:
  - apiKeyAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check that the API is running
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and receive a token
      description: >
        Demo accounts all use the password set by `npm run set-passwords`
        (default `campushub123`). The token is a JWT valid for 7 days.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: amara.okafor@campus.edu
              password: campushub123
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  id: user-01
                  name: Amara Okafor
                  email: amara.okafor@campus.edu
                  role: tier1
                  adminForClubs: []
        "400":
          description: Email or password missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Email and password are required.
        "401":
          description: Wrong email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid email or password.
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a member account
      description: Creates a user with the `member` role and signs them in.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: Test Student
              email: test.student@campus.edu
              password: longenough123
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  id: user-1791804321595
                  name: Test Student
                  email: test.student@campus.edu
                  role: member
                  adminForClubs: []
        "400":
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingFields:
                  value:
                    error: Name and email are required.
                invalidEmail:
                  value:
                    error: Enter a valid email address.
                shortPassword:
                  value:
                    error: Password must be at least 8 characters.
        "409":
          description: The email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: That email is already registered.
        "401":
          $ref: "#/components/responses/ApiKeyUnauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset
      description: >
        Always returns the same response whether or not the email is registered.
        No email is sent; the reset link is printed to the server console.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: amara.okafor@campus.edu
      responses:
        "200":
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
              example:
                ok: true
        "400":
          description: Email missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingEmail:
                  value:
                    error: Email is required.
                invalidEmail:
                  value:
                    error: Enter a valid email address.
        "401":
          $ref: "#/components/responses/ApiKeyUnauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: The token comes from the reset link printed to the server console and is valid for 1 hour.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
              example:
                ok: true
        "400":
          description: Bad token or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingToken:
                  value:
                    error: Reset token is required.
                shortPassword:
                  value:
                    error: Password must be at least 8 characters.
                badToken:
                  value:
                    error: That reset link is invalid or has expired.
        "401":
          $ref: "#/components/responses/ApiKeyUnauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the signed-in user
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: The user the token belongs to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
              example:
                user:
                  id: user-01
                  name: Amara Okafor
                  email: amara.okafor@campus.edu
                  role: tier1
                  adminForClubs: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /clubs:
    get:
      tags: [Clubs]
      operationId: listClubs
      summary: List all clubs
      description: Clubs are returned in alphabetical order by name.
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: All clubs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clubs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Club"
              example:
                clubs:
                  - id: club-04
                    name: Byte Club
                    category: Technology
                    description: Hands-on workshops, hackathon prep, and project nights for anyone into building software.
                    logoUrl: https://images.unsplash.com/photo-1758270705317-3ef6142d306f?w=200
                    meetingTime: Thursdays, 7:00 PM
                    meetingLocation: Engineering Building, Lab 108
                    tags: [coding, hackathon, workshops]
        "401":
          $ref: "#/components/responses/ApiKeyUnauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Clubs]
      operationId: createClub
      summary: Create a club
      description: Only tier1 users can create clubs.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubInput"
            example:
              name: Chess Society
              category: Social
              description: Casual and ranked chess nights.
              meetingTime: Wednesdays, 6:00 PM
              meetingLocation: Student Union, Room 102
              tags: [chess, games]
      responses:
        "201":
          description: Club created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  club:
                    $ref: "#/components/schemas/Club"
        "400":
          description: Missing club name or unknown category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingName:
                  value:
                    error: Club name is required.
                unknownCategory:
                  value:
                    error: "Unknown category: Cooking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Signed in, but not a tier1 user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Tier 1 admin access required.
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List all events
      description: Events are returned in date and time order.
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: All events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
              example:
                events:
                  - id: event-05
                    clubId: club-03
                    title: River Trail 5K
                    description: A social 5K along the river trail, coffee after at the Rec Center.
                    category: Sports & Fitness
                    date: "2026-10-12"
                    time: "06:30"
                    location: Rec Center steps
                    imageUrl: https://images.unsplash.com/photo-1745790289741-12a211a8325d?w=600
                    isSeed: true
        "401":
          $ref: "#/components/responses/ApiKeyUnauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create an event
      description: >
        The caller must manage the club the event belongs to. The new event gets
        an ID starting with `custom-`. The returned `date` can be one day earlier
        than the date sent when the server runs in a time zone ahead of UTC.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
            example:
              clubId: club-01
              title: README Test Event
              description: Testing
              category: Academic
              date: "2026-11-01"
              time: "18:00"
              location: Room 1
      responses:
        "201":
          description: Event created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: "#/components/schemas/Event"
              example:
                event:
                  id: custom-1791803508229
                  clubId: club-01
                  title: README Test Event
                  description: Testing
                  category: Academic
                  date: "2026-10-31"
                  time: "18:00"
                  location: Room 1
                  imageUrl: null
                  isSeed: false
        "400":
          description: Missing title or unknown category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingTitle:
                  value:
                    error: Title is required.
                unknownCategory:
                  value:
                    error: "Unknown category: Cooking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NoClubAccess"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the event.
        schema:
          type: string
          example: custom-1791803508229
    put:
      tags: [Events]
      operationId: updateEvent
      summary: Update an event
      description: >
        Replaces the event's fields. Only events whose ID starts with `custom-`
        can be changed; built-in `event-` events are read-only. The caller must
        manage the event's club. The club of an event cannot be changed.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
            example:
              title: README Test Event (updated)
              description: Testing
              category: Academic
              date: "2026-11-01"
              time: "19:00"
              location: Room 2
      responses:
        "200":
          description: Event updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: "#/components/schemas/Event"
        "400":
          description: Missing title or unknown category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingTitle:
                  value:
                    error: Title is required.
                unknownCategory:
                  value:
                    error: "Unknown category: Cooking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/EventForbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Delete an event
      description: >
        Only events whose ID starts with `custom-` can be deleted. The caller
        must manage the event's club. Signups for the event are deleted with it.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "204":
          description: Event deleted. The response body is empty.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/EventForbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin:
    get:
      tags: [Admin]
      operationId: getAdminDashboard
      summary: Per-key rate-limit status and last-IP tracking
      description: >
        Tier1-only operational view of the live rate limiter. One row per
        consumer that has sent traffic this process, plus every configured
        key that has not been used yet. Each key appears only as its
        fingerprint (a hashed keyId and a masked tail) — the raw key is
        never included. Rows with `active: false` count requests from the
        consumer's previous window; counters roll forward only on that
        consumer's next request. `byIp: true` rows are keyless requests,
        tracked by their IP instead. Calling this endpoint counts against
        its own caller's rate window.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: Current limiter status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
              example:
                windowMs: 60000
                max: 100
                consumers:
                  - keyId: 4f1a2b3c4d5e
                    maskedKey: pro…d41f
                    byIp: false
                    active: true
                    count: 13
                    max: 100
                    remaining: 87
                    limited: false
                    resetAt: "2026-10-26T10:15:00.000Z"
                    secondsUntilReset: 40
                    lastIp: "::ffff:127.0.0.1"
                    lastSeenAt: "2026-10-26T10:14:02.000Z"
                  - keyId: 8c9d0e1f2a3b
                    maskedKey: ring…77aa
                    byIp: false
                    active: false
                    count: 3
                    max: 100
                    remaining: 97
                    limited: false
                    resetAt: "2026-10-26T10:10:00.000Z"
                    secondsUntilReset: 0
                    lastIp: "203.0.113.24"
                    lastSeenAt: "2026-10-26T10:09:50.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List non-tier1 users
      description: Tier1 only. Feeds the promote/demote pickers and includes each user's admin and membership club ids.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: Users, A-Z by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/{id}/promote:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the user to promote.
        schema:
          type: string
          example: user-05
    post:
      tags: [Users]
      operationId: promoteUser
      summary: Make a user admin of a club
      description: Tier1 only. Adds a tier2 admin link for the given club; a member becomes tier2 when promoted.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubRoleInput"
            example:
              clubId: club-02
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400": { description: clubId missing, or that user is already a tier1 admin. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { description: No such club or user. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/{id}/demote:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the user to demote.
        schema:
          type: string
          example: user-05
    post:
      tags: [Users]
      operationId: demoteUser
      summary: Remove a user's admin access to a club
      description: Tier1 only. Tier1 accounts cannot be demoted here.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubRoleInput"
            example:
              clubId: club-02
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400": { description: clubId missing, or the target is a tier1 admin. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { description: No such user. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin-requests:
    get:
      tags: [Admin requests]
      operationId: listAdminRequests
      summary: List pending club-admin requests
      description: Tier1 only. Pending requests only, oldest first.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: Pending requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminRequest"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [Admin requests]
      operationId: createAdminRequest
      summary: Request admin access to a club
      description: Any signed-in user. One pending request per user per club.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clubId]
              properties:
                clubId:
                  type: string
            example:
              clubId: club-03
      responses:
        "201":
          description: Request recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400": { description: clubId missing, or the caller already manages that club. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Club not found. }
        "409": { description: A pending request already exists for this club. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin-requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/AdminRequestId"
    post:
      tags: [Admin requests]
      operationId: approveAdminRequest
      summary: Approve a pending request
      description: Tier1 only. Promotes the requester to tier2 admin of that club and marks the request approved.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: Request approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400": { description: The request has already been handled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { description: Request not found. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin-requests/{id}/deny:
    parameters:
      - $ref: "#/components/parameters/AdminRequestId"
    post:
      tags: [Admin requests]
      operationId: denyAdminRequest
      summary: Deny a pending request
      description: Tier1 only.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: Request denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { description: No pending request with that id. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /clubs/{clubId}:
    parameters:
      - $ref: "#/components/parameters/ClubId"
    put:
      tags: [Clubs]
      operationId: updateClubPlaybook
      summary: Set a club's playbook overrides
      description: >
        Club admins and tier1 only. Every field is optional; an empty string
        clears that override and the member workspace falls back to the
        category default. Send focusItems as an array or a newline-separated
        string (max 5 items).
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubPlaybookInput"
            example:
              rsvpLabel: I'll be there
              bringNote: Bring a notebook and your student ID.
              focusTitle: This week
              focusBody: Two workshops and a study night.
              focusItems:
                - Workshop: Intro to React
                - Study night, Thursday 6pm
              focusLink: https://example.com/club-notes
      responses:
        "200":
          description: Club with the saved overrides.
          content:
            application/json:
              schema:
                type: object
                properties:
                  club:
                    $ref: "#/components/schemas/Club"
        "400": { description: The focus link does not start with http:// or https://. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NoClubAccess" }
        "404": { description: Club not found. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /clubs/{clubId}/members:
    parameters:
      - $ref: "#/components/parameters/ClubId"
    get:
      tags: [Clubs]
      operationId: listClubMembers
      summary: List a club's roster
      description: Visible to that club's members and admins. Email addresses are only included for admins.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: Club members, oldest join first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClubMember"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The caller is neither a member nor an admin of that club. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [Clubs]
      operationId: joinClub
      summary: Join a club as the current user
      description: Idempotent — joining a club you already belong to returns the user again.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "201":
          description: Membership recorded; the refreshed user is returned so the client can switch views.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Club not found. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /clubs/{clubId}/members/me:
    parameters:
      - $ref: "#/components/parameters/ClubId"
    delete:
      tags: [Clubs]
      operationId: leaveClub
      summary: Leave a club
      description: Drops the caller's membership. Club-admin links are separate and are not removed here.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: Refreshed user after leaving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /signups:
    post:
      tags: [Signups]
      operationId: createSignup
      summary: Sign the current user up for an event
      description: >
        Idempotent: an existing signup is returned with 200 instead of erroring.
        Capacity never rejects a signup — overflow is waitlisted in arrival
        order, which GET /signups/mine reports.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId:
                  type: string
            example:
              eventId: event-05
      responses:
        "201":
          description: Signed up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEnvelope"
        "200":
          description: Already signed up; the existing signup is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEnvelope"
        "400": { description: eventId is required. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Event not found. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /signups/mine:
    get:
      tags: [Signups]
      operationId: listMySignups
      summary: List the current user's signups
      description: >
        Each signup carries its `position` among that event's signups (earliest
        first) and `waitlisted`, computed against the event's capacity. The
        roster itself is not exposed here.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: The caller's signups, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  signups:
                    type: array
                    items:
                      $ref: "#/components/schemas/MySignup"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /signups/event/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Signups]
      operationId: listEventSignups
      summary: List everyone signed up for an event
      description: Requires admin access to the event's club.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: Signups for the event.
          content:
            application/json:
              schema:
                type: object
                properties:
                  signups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Signup"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NoClubAccess" }
        "404": { $ref: "#/components/responses/EventNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /signups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the signup.
        schema:
          type: string
          example: signup-1791803508229
    delete:
      tags: [Signups]
      operationId: cancelSignup
      summary: Cancel a signup
      description: Only the owner can cancel their own signup. A freed seat promotes the next waitlisted member by position.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "204":
          description: Signup deleted. The response body is empty.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The signup belongs to someone else. }
        "404": { description: Signup not found. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /comments:
    get:
      tags: [Comments]
      operationId: listComments
      summary: Read a thread
      description: >
        Public. Pinned comments first, then oldest first. `canModerate` and each
        reaction's `mine` need the caller's token, so authentication is optional
        here rather than required.
      security:
        - apiKeyAuth: []
      parameters:
        - name: targetType
          in: query
          required: true
          schema:
            type: string
            enum: [event, club]
        - name: targetId
          in: query
          required: true
          schema:
            type: string
            example: event-05
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
        "400": { description: targetType or targetId missing. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [Comments]
      operationId: createComment
      summary: Post a comment or a reply
      description: Replies may only go one level deep and must stay in the same thread. Text is capped at 1000 characters.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
            example:
              targetType: event
              targetId: event-05
              text: See you there!
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment:
                    $ref: "#/components/schemas/Comment"
        "400":
          {
            description: Bad target type,
            empty/oversized text,
            a reply to a reply,
            or a reply across threads.,
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: The target, or the comment being replied to, does not exist. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /comments/{id}/reactions:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [Comments]
      operationId: toggleReaction
      summary: Toggle one reaction on a comment
      description: "Supported reactions: 👍 ❤️ 🎉 😂. Posting the same emoji again removes it."
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji:
                  type: string
                  enum: ["👍", "❤️", "🎉", "😂"]
      responses:
        "200":
          description: The comment's full reaction list after the toggle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reaction"
        "400": { description: That reaction is not supported. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Comment not found. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /comments/{id}/pin:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    patch:
      tags: [Comments]
      operationId: pinComment
      summary: Pin or unpin a top-level comment
      description: "Club admins and tier1 only. Pinned comments lead the thread. Send `pinned: false` to unpin; anything else pins."
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned:
                  type: boolean
                  default: true
      responses:
        "200":
          description: The updated comment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment:
                    $ref: "#/components/schemas/Comment"
        "400": { description: Only top-level comments can be pinned. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Only club admins can pin comments. }
        "404": { description: Comment not found. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /comments/{id}:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: Delete a comment
      description: The author can delete their own comment; club admins can delete any comment in their club's threads. Replies and reactions cascade.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      responses:
        "204":
          description: Comment deleted. The response body is empty.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not the author and not an admin of the club. }
        "404": { description: Comment not found. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /announcements:
    get:
      tags: [Announcements]
      operationId: listAnnouncements
      summary: List a club's announcements
      description: Newest first.
      security:
        - apiKeyAuth: []
      parameters:
        - name: clubId
          in: query
          required: true
          schema:
            type: string
            example: club-01
      responses:
        "200":
          description: Announcements for the club.
          content:
            application/json:
              schema:
                type: object
                properties:
                  announcements:
                    type: array
                    items:
                      $ref: "#/components/schemas/Announcement"
        "400": { description: clubId is required. }
        "404": { description: Club not found. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [Announcements]
      operationId: createAnnouncement
      summary: Post an announcement
      description: Club admins and tier1 only.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clubId, text]
              properties:
                clubId:
                  type: string
                text:
                  type: string
            example:
              clubId: club-01
              text: Room change for Thursday — we're in Lab 204.
      responses:
        "201":
          description: Announcement posted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  announcement:
                    $ref: "#/components/schemas/Announcement"
        "400": { description: Announcement text is empty. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NoClubAccess" }
        "404": { description: Club not found. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /partner/produce:
    get:
      tags: [Partner]
      operationId: listPartnerProduce
      summary: List partner produce listings
      description: >
        Proxied to the AgroConnect partner API so the partner key stays on the
        server. On a partner failure the last good copy is served with
        `stale: true` and the time it was saved; if there has never been a
        success, 502.
      security:
        - apiKeyAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: county
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Listings, live or stale.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PartnerEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProduceListing"
        "502": { description: The partner is unavailable and no saved copy exists. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /partner/farmers:
    get:
      tags: [Partner]
      operationId: listPartnerFarmers
      summary: List partner farmers
      description: Proxied to AgroConnect. Phone numbers are not forwarded.
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: Farmers, live or stale.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PartnerEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Farmer"
        "502": { description: The partner is unavailable and no saved copy exists. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /partner/farmers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Partner farmer id (positive integer).
        schema:
          type: integer
          example: 7
    get:
      tags: [Partner]
      operationId: getPartnerFarmer
      summary: Get one partner farmer
      description: A missing farmer is a real 404, not a stale-cache case.
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: The farmer, live or stale.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PartnerEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Farmer"
        "404": { description: Farmer not found. }
        "422": { description: The id is not a positive integer. }
        "502": { description: The partner is unavailable and no saved copy exists. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /partner/orders:
    post:
      tags: [Partner]
      operationId: createPartnerOrder
      summary: Place an order on the partner API
      description: >
        Signed-in users only. This writes to the partner's live database, so it
        is never retried; the server logs in as the configured buyer account
        first. Partner 409/422 responses are passed through; anything else
        becomes 502.
      security:
        - apiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, quantity]
              properties:
                listingId:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
            example:
              listingId: 12
              quantity: 2
      responses:
        "201":
          description: Order placed on the partner side.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: integer
                  total:
                    type: number
                  status:
                    type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: The partner rejected the order as a conflict. }
        "422": { description: Invalid input, including a partner-side validation error. }
        "502": { description: The partner is unavailable. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /stats:
    get:
      tags: [Operations]
      operationId: getStats
      summary: Running request totals
      description: >
        In-memory totals since this server process started: request counts,
        client/server errors, average and max response time, and a per-route
        breakdown. Resets on restart and is not shared across server copies.
        Requires an API key, like every endpoint except /health.
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: Current totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401": { $ref: "#/components/responses/ApiKeyUnauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: One private key per consumer, handed out by direct message. Every endpoint requires it except GET /health.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClubId:
      name: clubId
      in: path
      required: true
      description: ID of the club.
      schema:
        type: string
        example: club-01
    EventId:
      name: eventId
      in: path
      required: true
      description: ID of the event.
      schema:
        type: string
        example: event-05
    CommentId:
      name: id
      in: path
      required: true
      description: ID of the comment.
      schema:
        type: string
        example: comment-1791803508229
    AdminRequestId:
      name: id
      in: path
      required: true
      description: ID of the admin request.
      schema:
        type: integer
        example: 3

  responses:
    ApiKeyUnauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Missing or invalid API key.
    TooManyRequests:
      description: The key exceeded 100 requests in 60 seconds.
      headers:
        Retry-After:
          description: Seconds to wait before sending another request with this key.
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              retryAfter:
                type: integer
          example:
            error: Too many requests.
            retryAfter: 42
    Unauthorized:
      description: Missing or invalid API key, or missing/invalid bearer token on a protected endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Not authenticated.
    NoClubAccess:
      description: The caller does not manage that club.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "You don't have admin access to that club."
    EventForbidden:
      description: The event is a built-in event, or the caller does not manage its club.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            seedEvent:
              value:
                error: Seed events are read-only.
            noClubAccess:
              value:
                error: "You don't have admin access to that club."
    EventNotFound:
      description: No event has that ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Event not found.
    AdminForbidden:
      description: The bearer token is valid but its account is not a tier1 admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Tier 1 admin access required.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.

    Ok:
      type: object
      properties:
        ok:
          type: boolean

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: "JWT to send as the header `Authorization: Bearer <token>`."
        user:
          $ref: "#/components/schemas/User"

    AdminDashboard:
      type: object
      properties:
        windowMs:
          type: integer
          description: Rate-limit window length in milliseconds.
          example: 60000
        max:
          type: integer
          description: Requests allowed per consumer per window.
          example: 100
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/RateLimitStatus"

    RateLimitStatus:
      type: object
      properties:
        keyId:
          type: string
          nullable: true
          description: First 12 hex chars of the SHA-256 of the key. Null for keyless (IP-tracked) consumers.
          example: 8c9d0e1f2a3b
        maskedKey:
          type: string
          nullable: true
          description: "Key tail display like `pro…d41f`. Never the full key. Null for IP consumers and unused keys are masked the same way."
          example: pro…d41f
        byIp:
          type: boolean
          description: True when the request carried no API key and was tracked by IP.
        active:
          type: boolean
          description: True while the consumer's current window is still open.
        count:
          type: integer
          description: Requests counted in the current (or, for inactive rows, last) window.
        max:
          type: integer
        remaining:
          type: integer
        limited:
          type: boolean
          description: True while the consumer is over the limit and receiving 429s.
        resetAt:
          type: string
          format: date-time
          nullable: true
        secondsUntilReset:
          type: integer
          description: 0 when the window has already passed; it rolls over on the consumer's next request.
        lastIp:
          type: string
          nullable: true
          description: Last IP the consumer was seen from. Null until they have made a request.
          example: "203.0.113.24"
        lastSeenAt:
          type: string
          format: date-time
          nullable: true

    User:
      type: object
      properties:
        id:
          type: string
          example: user-01
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [tier1, tier2, member]
        adminForClubs:
          type: array
          items:
            type: string
        memberOfClubs:
          type: array
          items:
            type: string
          description: Clubs the user belongs to, from club_members.

    Club:
      type: object
      properties:
        id:
          type: string
          example: club-04
        name:
          type: string
        category:
          type: string
        description:
          type: string
        logoUrl:
          type: string
        meetingTime:
          type: string
        meetingLocation:
          type: string
        tags:
          type: array
          items:
            type: string

    ClubInput:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
        category:
          type: string
          description: Name of an existing category, for example Technology or Social.
        description:
          type: string
        logoUrl:
          type: string
        meetingTime:
          type: string
        meetingLocation:
          type: string
        tags:
          description: A list of tags, or a single comma-separated string.
          oneOf:
            - type: array
              items:
                type: string
            - type: string

    Event:
      type: object
      properties:
        id:
          type: string
          example: event-05
        clubId:
          type: string
          description: ID of the hosting club.
          example: club-03
        title:
          type: string
        description:
          type: string
        category:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
          description: 24-hour time, HH:MM.
          example: "18:00"
        location:
          type: string
        imageUrl:
          type: string
          nullable: true
        isSeed:
          type: boolean
          description: True for the built-in demo events.

    EventInput:
      type: object
      required: [title, category, date, time]
      properties:
        clubId:
          type: string
          description: Required when creating an event. Ignored when updating one.
        title:
          type: string
        description:
          type: string
        category:
          type: string
          description: Name of an existing category, for example Academic or Technology.
        date:
          type: string
          format: date
        time:
          type: string
          example: "18:00"
        location:
          type: string
        imageUrl:
          type: string
    ClubRoleInput:
      type: object
      required: [clubId]
      properties:
        clubId:
          type: string
          example: club-02

    ClubPlaybookInput:
      type: object
      description: Every field is optional; an empty string clears that override.
      properties:
        rsvpLabel:
          type: string
          maxLength: 40
        bringNote:
          type: string
          maxLength: 240
        focusTitle:
          type: string
          maxLength: 120
        focusBody:
          type: string
          maxLength: 500
        focusItems:
          description: Up to five short lines. A newline-separated string is also accepted.
          oneOf:
            - type: array
              maxItems: 5
              items:
                type: string
            - type: string
        focusLink:
          type: string
          format: uri
          maxLength: 300

    ClubMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [tier1, tier2, member]
        joinedAt:
          type: string
          format: date-time
        email:
          type: string
          format: email
          description: Only present when the caller is an admin of this club.

    Signup:
      type: object
      properties:
        id:
          type: string
          example: signup-1791803508229
        eventId:
          type: string
        userId:
          type: string
        name:
          type: string
          description: Name snapshot taken when the signup was created.
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time

    MySignup:
      allOf:
        - $ref: "#/components/schemas/Signup"
        - type: object
          properties:
            position:
              type: integer
              description: 1-based place among the event's signups, earliest first.
            waitlisted:
              type: boolean
              description: True when position exceeds the event's capacity.

    SignupEnvelope:
      type: object
      properties:
        signup:
          $ref: "#/components/schemas/Signup"

    Reaction:
      type: object
      properties:
        emoji:
          type: string
          enum: ["👍", "❤️", "🎉", "😂"]
        count:
          type: integer
        mine:
          type: boolean
          description: True when the caller has reacted with this emoji (false for anonymous readers).

    Comment:
      type: object
      properties:
        id:
          type: string
        targetType:
          type: string
          enum: [event, club]
        targetId:
          type: string
        userId:
          type: string
        userName:
          type: string
        text:
          type: string
        parentId:
          type: string
          nullable: true
          description: Set on replies; replies are only one level deep.
        pinned:
          type: boolean
        createdAt:
          type: string
          format: date-time
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"
        canModerate:
          type: boolean
          description: True when the caller may pin or delete this comment.

    CommentInput:
      type: object
      required: [targetType, targetId, text]
      properties:
        targetType:
          type: string
          enum: [event, club]
        targetId:
          type: string
        text:
          type: string
          maxLength: 1000
        parentId:
          type: string
          description: Optional top-level comment id to reply to.

    Announcement:
      type: object
      properties:
        id:
          type: string
        clubId:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time

    AdminRequest:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        userName:
          type: string
        userEmail:
          type: string
          format: email
        clubId:
          type: string
        clubName:
          type: string
        status:
          type: string
          enum: [pending, approved, denied]
        createdAt:
          type: string
          format: date-time

    PartnerEnvelope:
      type: object
      properties:
        stale:
          type: boolean
          description: True when the partner call failed and a saved copy is being served.
        asOf:
          type: string
          format: date-time
          description: When this data was fetched from the partner.
        data:
          description: Endpoint-specific payload; see each partner operation.

    ProduceListing:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        price:
          type: number
        unit:
          type: string
        quantity:
          type: number
        county:
          type: string
        sellerName:
          type: string
        availableFrom:
          type: string

    Farmer:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        county:
          type: string
        focus:
          type: string

    Stats:
      type: object
      properties:
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
        total:
          type: integer
        clientErrors:
          type: integer
        serverErrors:
          type: integer
        errorRatePercent:
          type: number
        avgMs:
          type: number
        routes:
          type: object
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              clientErrors:
                type: integer
              serverErrors:
                type: integer
              avgMs:
                type: number
              maxMs:
                type: number

    UserEnvelope:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
