server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Same-origin API: avoids a second CORS surface and keeps the frontend's
  # relative /api URL valid in every environment.
  location /api/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # Hashed Vite assets are immutable; the HTML must revalidate so a deploy is
  # picked up immediately. `expires` (not add_header) is used here so the
  # server-level security headers stay inherited into these locations.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # `/` is a document route, not a static file, so send it to the prerender
  # gateway instead of letting nginx's index directive serve the shell.
  location = / {
    proxy_pass http://prerender:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires -1;
  }

  # Existing files (fonts, images, the service worker) stay on nginx. Every
  # other document request gets an HTML shell whose title, description,
  # canonical and Open Graph tags match the route.
  location / {
    try_files $uri @prerender;
    expires -1;
  }

  location @prerender {
    proxy_pass http://prerender:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires -1;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
