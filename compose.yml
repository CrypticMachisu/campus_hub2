name: kesho

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: campushub_standalone
      MYSQL_USER: campushub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/.env}
    volumes:
      - db_data:/var/lib/mysql
      # First boot only. The production default is schema-only; set
      # BOOTSTRAP_SQL=./server/campushub_database.sql for a disposable demo
      # stack. Later schema changes use migrations.
      - ${BOOTSTRAP_SQL:-./server/campushub_schema.sql}:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./deploy/mysql/01-grant.sql:/docker-entrypoint-initdb.d/01-grant.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s

  migrate:
    build: ./server
    restart: "no"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: campushub_standalone
      DB_USER: campushub
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SEED_PASSWORD: ${SEED_PASSWORD:-campushub123}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Campus operator}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_CAMPUS_NAME: ${BOOTSTRAP_CAMPUS_NAME:-}
      BOOTSTRAP_CAMPUS_SLUG: ${BOOTSTRAP_CAMPUS_SLUG:-}
      BOOTSTRAP_CAMPUS_DOMAIN: ${BOOTSTRAP_CAMPUS_DOMAIN:-}
    depends_on:
      db:
        condition: service_healthy
    # The bootstrap SQL already contains the schema. Baseline records that, so
    # a fresh volume does not replay ALTER TABLE statements that were already
    # folded into the schema. On an already-tracked database baseline refuses,
    # and the following migrate applies only genuinely pending files.
    command: ["sh", "-c", "npm run migrate:baseline || true; npm run migrate"]

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: campushub_standalone
      DB_USER: campushub
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      API_KEYS: ${API_KEYS:?set API_KEYS in deploy/.env}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: "1"
      CROSS_UNIVERSITY_ENABLED: ${CROSS_UNIVERSITY_ENABLED:-false}
      EMAIL_REMINDERS: ${EMAIL_REMINDERS:-off}
      MEDIA_CLEANUP: ${MEDIA_CLEANUP:-on}
      MEDIA_PURGE_HOURS: ${MEDIA_PURGE_HOURS:-24}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    stop_grace_period: 15s

  # Internal only. nginx sends document fallbacks here so crawlers get
  # route-specific title, description, canonical and Open Graph tags. The API
  # key is only used server-to-server inside the compose network.
  prerender:
    build:
      context: .
      target: prerender
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_API_KEY: ${VITE_API_KEY:?set VITE_API_KEY in deploy/.env to the same value as one API_KEYS entry}
        VITE_CROSS_UNIVERSITY_ENABLED: ${CROSS_UNIVERSITY_ENABLED:-false}
    restart: unless-stopped
    environment:
      PORT: "3000"
      API_INTERNAL_URL: http://api:5000
      PRERENDER_API_KEY: ${VITE_API_KEY:?set VITE_API_KEY in deploy/.env to the same value as one API_KEYS entry}
      SITE_URL: ${PUBLIC_URL:-}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_API_KEY: ${VITE_API_KEY:?set VITE_API_KEY in deploy/.env to the same value as one API_KEYS entry}
        VITE_CROSS_UNIVERSITY_ENABLED: ${CROSS_UNIVERSITY_ENABLED:-false}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      prerender:
        condition: service_healthy

  # Optional TLS edge: `--profile tls` starts Caddy on ports 80/443 and obtains
  # a public certificate automatically for SITE_ADDRESS. Keep web/api bound to
  # loopback so all public traffic goes through TLS.
  proxy:
    image: caddy:2.10-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
  caddy_config:
